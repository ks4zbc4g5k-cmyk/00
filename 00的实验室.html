<style>/* ===== 全局变量 ===== */
:root {
  --bg: #faf9f7;
  --sidebar-bg: #2c2420;
  --sidebar-hover: #3d322c;
  --sidebar-active: #6f4e37;
  --text: #2c2420;
  --text-light: #6b6b6b;
  --text-white: #f0ebe5;
  --card-bg: #ffffff;
  --border: #e8e2dc;
  --accent: #6f4e37;
  --accent-light: #a0785a;
  --accent-bg: #f5efe9;
  --success: #5b8c5a;
  --warning: #d4915d;
  --danger: #c0604e;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* Emoji 图标降级 */
.icon-text {
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", "EmojiOne Color", "Android Emoji", sans-serif;
}

/* ===== 侧边栏 ===== */
.sidebar {
  width: 220px;
  background: var(--sidebar-bg);
  color: var(--text-white);
  display: flex;
  flex-direction: column;
  position: fixed;
  height: 100vh;
  left: 0;
  top: 0;
  z-index: 100;
}

.sidebar-header {
  padding: 24px 20px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-header h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.sidebar-nav {
  flex: 1;
  padding: 12px 8px;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  color: var(--text-white);
  text-decoration: none;
  border-radius: 8px;
  font-size: 14px;
  transition: all 0.2s;
  margin-bottom: 2px;
  opacity: 0.7;
}

.nav-item:hover {
  background: var(--sidebar-hover);
  opacity: 1;
}

.nav-item.active {
  background: var(--sidebar-active);
  opacity: 1;
}

.nav-icon {
  font-size: 18px;
  width: 24px;
  text-align: center;
}

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.btn-export, .btn-import {
  width: 100%;
  padding: 8px;
  border: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: var(--text-white);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 8px;
  transition: all 0.2s;
}

.btn-export:hover, .btn-import:hover {
  background: var(--sidebar-hover);
}

.storage-info {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  text-align: center;
}

/* ===== 主内容区 ===== */
.main-content {
  flex: 1;
  margin-left: 220px;
  padding: 32px 40px;
  min-height: 100vh;
}

.page-title {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 6px;
}

.page-subtitle {
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 28px;
}

/* ===== 卡片 ===== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 20px;
  margin-bottom: 16px;
  transition: box-shadow 0.2s;
}

.card:hover {
  box-shadow: var(--shadow-lg);
}

/* ===== 概览统计卡片 ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 24px;
  text-align: center;
}

.stat-icon {
  font-size: 36px;
  margin-bottom: 8px;
}

.stat-number {
  font-size: 32px;
  font-weight: 800;
  color: var(--accent);
}

.stat-label {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 4px;
}

/* ===== 列表 ===== */
.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.list-header h2 {
  font-size: 20px;
  font-weight: 700;
}

/* ===== 表格 ===== */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.data-table th {
  text-align: left;
  padding: 12px 16px;
  background: var(--accent-bg);
  color: var(--text);
  font-weight: 600;
  border-bottom: 2px solid var(--border);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.data-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.data-table tr:hover {
  background: var(--accent-bg);
}

/* ===== 标签 ===== */
.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}

.tag-coffee { background: #e8ddd4; color: #6f4e37; }
.tag-syrup { background: #fce4ec; color: #c0604e; }
.tag-milk { background: #e8f0fa; color: #4a6fa5; }
.tag-other { background: #e8f5e9; color: #5b8c5a; }
.tag-low { background: #fff3e0; color: #d4915d; }

/* ===== 评分星星 ===== */
.stars {
  color: #d4a040;
  font-size: 16px;
  letter-spacing: 2px;
}

/* ===== 按钮 ===== */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover {
  background: #5a3e2c;
}

.btn-secondary {
  background: var(--accent-bg);
  color: var(--accent);
}

.btn-secondary:hover {
  background: #ede5dd;
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-danger:hover {
  background: #a04938;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 13px;
}

/* ===== 浮动按钮 ===== */
.fab {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  border: none;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(111, 78, 55, 0.4);
  z-index: 50;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fab:hover {
  transform: scale(1.1);
  background: #5a3e2c;
}

/* ===== 模态框 ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  justify-content: center;
  align-items: flex-start;
  padding-top: 5vh;
  overflow-y: auto;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: white;
  border-radius: 12px;
  width: 90%;
  max-width: 600px;
  box-shadow: var(--shadow-lg);
  margin-bottom: 40px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}

.modal-header h2 {
  font-size: 20px;
  font-weight: 700;
}

.modal-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--text-light);
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.2s;
}

.modal-close:hover {
  background: var(--accent-bg);
}

.modal-body {
  padding: 24px;
  max-height: 60vh;
  overflow-y: auto;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
}

/* ===== 表单 ===== */
.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: white;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.form-group textarea {
  resize: vertical;
  min-height: 80px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

/* ===== 图片上传 ===== */
.image-upload-area {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg);
}

.image-upload-area:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}

.image-preview {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 8px;
  margin-top: 10px;
}

/* ===== 图库网格 ===== */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

.gallery-item {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
  cursor: pointer;

<title>00的实验室</title>
</head>
<body>

<!-- 移动端菜单按钮 -->
<button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

      <span class="nav-icon">📊</span> 概览
    </a>

    </a>

</main>

<!-- 模态框 -->
<div class="modal-overlay" id="modal-overlay">

      <h2 id="modal-title">标题</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>

</div>

<script>// ===== 数据管理 =====
const DB_KEY = 'coffee_lab_db_v1';

let db = {
  materials: [],    // 原材料
  recipes: [],      // 配方
  journals: [],     // 研发日志
  images: [],       // 成品图片
};

// 加载数据
function loadDB() {
  const saved = localStorage.getItem(DB_KEY);
  if (saved) {
    try {
      db = JSON.parse(saved);
    } catch(e) {
      console.error('数据加载失败', e);
    }
  }
}

// 保存数据
function saveDB() {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  updateStorageInfo();
}

// 更新存储信息
function updateStorageInfo() {
  const size = new Blob([JSON.stringify(db)]).size;
  const kb = (size / 1024).toFixed(1);
  const el = document.getElementById('storage-info');
  if (el) {
    el.textContent = `本地存储 ${kb}KB`;
  }
}

// 生成ID
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

// 格式化日期
function formatDate(ts) {
  const d = new Date(ts);
  const Y = d.getFullYear();
  const M = String(d.getMonth()+1).padStart(2,'0');
  const D = String(d.getDate()).padStart(2,'0');
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return `${Y}-${M}-${D} ${h}:${m}`;
}

function formatDateShort(ts) {
  const d = new Date(ts);
  const Y = d.getFullYear();
  const M = String(d.getMonth()+1).padStart(2,'0');
  const D = String(d.getDate()).padStart(2,'0');
  return `${Y}-${M}-${D}`;
}

// ===== 页面路由 =====
let currentPage = 'dashboard';

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  renderPage(page);
  // 移动端关闭侧边栏
  document.getElementById('sidebar').classList.remove('open');
}

function renderPage(page) {
  const main = document.getElementById('main-content');
  switch(page) {
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'materials': main.innerHTML = renderMaterials(); break;
    case 'recipes': main.innerHTML = renderRecipes(); break;
    case 'journal': main.innerHTML = renderJournal(); break;
    case 'gallery': main.innerHTML = renderGallery(); break;
  }
}

// ===== 概览页 =====
function renderDashboard() {
  const materialCount = db.materials.length;
  const recipeCount = db.recipes.length;
  const journalCount = db.journals.length;
  const imageCount = db.images.length;

  // 低库存预警
  const lowStock = db.materials.filter(m => m.stock <= (m.minStock || 0));

  // 最近日志
  const recentJournals = [...db.journals].sort((a,b) => b.createdAt - a.createdAt).slice(0, 3);

  // 最近配方
  const recentRecipes = [...db.recipes].sort((a,b) => b.createdAt - a.createdAt).slice(0, 3);

  let html = `
    <h1 class="page-title">🧪 00的实验室</h1>
    <p class="page-subtitle">咖啡饮品研发工作台 · ${formatDateShort(Date.now())}</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-number">${materialCount}</div>
        <div class="stat-label">原材料种类</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-number">${recipeCount}</div>
        <div class="stat-label">配方数量</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔬</div>
        <div class="stat-number">${journalCount}</div>
        <div class="stat-label">研发日志</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📸</div>
        <div class="stat-number">${imageCount}</div>
        <div class="stat-label">成品图片</div>
      </div>
    </div>
  `;

  // 低库存预警
  if (lowStock.length > 0) {
    html += `
      <div class="card" style="border-left: 4px solid var(--warning);">
        <h3 style="font-size:16px;margin-bottom:12px;">⚠️ 库存预警</h3>
    `;
    lowStock.forEach(m => {
      html += `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;">
        <span>${m.name}</span>
        <span class="tag tag-low">剩余 ${m.stock}${m.unit || ''}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // 最近研发日志
  html += `<div class="list-header"><h2>最近研发日志</h2></div>`;
  if (recentJournals.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">🔬</div>
      <div class="empty-state-text">还没有研发日志</div>
      <div class="empty-state-hint">点击右下角 + 添加第一条</div>
    </div>`;
  } else {
    recentJournals.forEach(j => {
      html += `
        <div class="journal-card">
          <div class="journal-card-header">
            <div class="journal-card-title">${j.title}</div>
            <div class="journal-card-date">${formatDateShort(j.createdAt)}</div>
          </div>
          <div class="journal-card-body">${j.content.substring(0, 150)}${j.content.length > 150 ? '...' : ''}</div>
        </div>
      `;
    });
  }

  // 最近配方
  html += `<div class="list-header" style="margin-top:28px;"><h2>最近配方</h2></div>`;
  if (recentRecipes.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">📝</div>
      <div class="empty-state-text">还没有配方记录</div>
      <div class="empty-state-hint">点击右下角 + 添加第一个配方</div>
    </div>`;
  } else {
    html += `<table class="data-table"><thead><tr>
      <th>配方名称</th><th>类型</th><th>评分</th><th>成本</th><th>日期</th>
    </tr></thead><tbody>`;
    recentRecipes.forEach(r => {
      html += `<tr>
        <td><strong>${r.name}</strong></td>
        <td><span class="tag tag-coffee">${r.type || '未分类'}</span></td>
        <td>${renderStars(r.rating || 0)}</td>
        <td class="cost-display">${r.cost ? '¥' + r.cost : '-'}</td>
        <td>${formatDateShort(r.createdAt)}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }

  return html;
}

// ===== 原材料管理 =====
function renderMaterials() {
  let html = `
    <h1 class="page-title">📦 原材料</h1>
    <p class="page-subtitle">管理咖啡豆、糖浆、牛奶等原材料库存</p>
  `;

  if (db.materials.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">📦</div>
      <div class="empty-state-text">还没有原材料记录</div>
      <div class="empty-state-hint">点击右下角 + 添加原材料</div>
    </div>`;
    return html;
  }

  // 筛选
  html += `<div class="filter-bar">
    <select id="filter-material-type" onchange="renderMaterialTable()">
      <option value="">全部类型</option>
      <option value="咖啡豆">咖啡豆</option>
      <option value="糖浆">糖浆</option>
      <option value="牛奶">牛奶</option>
      <option value="其他">其他</option>
    </select>
    <input type="text" id="search-material" placeholder="搜索原材料..." oninput="renderMaterialTable()">
  </div>`;

  html += `<div id="material-table-container"></div>`;
  return html;
}

function renderMaterialTable() {
  const typeFilter = document.getElementById('filter-material-type')?.value || '';
  const search = document.getElementById('search-material')?.value.toLowerCase() || '';

  let filtered = db.materials.filter(m => {
    if (typeFilter && m.type !== typeFilter) return false;
    if (search && !m.name.toLowerCase().includes(search)) return false;
    return true;
  });

  let html = `<table class="data-table"><thead><tr>
    <th>名称</th><th>类型</th><th>库存</th><th>单位</th><th>单价</th><th>状态</th><th>操作</th>
  </tr></thead><tbody>`;

  filtered.forEach(m => {
    const tagClass = m.type === '咖啡豆' ? 'tag-coffee' :
                     m.type === '糖浆' ? 'tag-syrup' :
                     m.type === '牛奶' ? 'tag-milk' : 'tag-other';
    const lowStock = m.stock <= (m.minStock || 0);
    html += `<tr>
      <td><strong>${m.name}</strong></td>
      <td><span class="tag ${tagClass}">${m.type || '未分类'}</span></td>
      <td>${m.stock}</td>
      <td>${m.unit || ''}</td>
      <td>${m.price ? '¥' + m.price : '-'}</td>
      <td>${lowStock ? '<span class="tag tag-low">库存不足</span>' : '<span class="tag" style="background:#e8f5e9;color:#5b8c5a;">正常</span>'}</td>
      <td>
        <button class="btn btn-sm btn-secondary" onclick="editMaterial('${m.id}')">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMaterial('${m.id}')">删除</button>
      </td>
    </tr>`;
  });

  html += `</tbody></table>`;
  const container = document.getElementById('material-table-container');
  if (container) container.innerHTML = html;
}

// ===== 配方管理 =====
function renderRecipes() {
  let html = `
    <h1 class="page-title">📝 配方库</h1>
    <p class="page-subtitle">记录每款饮品的配方、成本和评分</p>
  `;

  if (db.recipes.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">📝</div>
      <div class="empty-state-text">还没有配方记录</div>
      <div class="empty-state-hint">点击右下角 + 添加第一个配方</div>
    </div>`;
    return html;
  }

  html += `<table class="data-table"><thead><tr>
    <th>配方名称</th><th>类型</th><th>评分</th><th>成本</th><th>日期</th><th>操作</th>
  </tr></thead><tbody>`;

  [...db.recipes].sort((a,b) => b.createdAt - a.createdAt).forEach(r => {
    html += `<tr>
      <td><strong>${r.name}</strong></td>
      <td><span class="tag tag-coffee">${r.type || '未分类'}</span></td>
      <td>${renderStars(r.rating || 0)}</td>
      <td class="cost-display">${r.cost ? '¥' + r.cost : '-'}</td>
      <td>${formatDateShort(r.createdAt)}</td>
      <td>
        <button class="btn btn-sm btn-secondary" onclick="viewRecipe('${r.id}')">查看</button>
        <button class="btn btn-sm btn-secondary" onclick="editRecipe('${r.id}')">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteRecipe('${r.id}')">删除</button>
      </td>
    </tr>`;
  });

  html += `</tbody></table>`;
  return html;
}

// ===== 研发日志 =====
function renderJournal() {
  let html = `
    <h1 class="page-title">🔬 研发日志</h1>
    <p class="page-subtitle">记录研发心得、口感调整和改进方向</p>
  `;

  if (db.journals.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">🔬</div>
      <div class="empty-state-text">还没有研发日志</div>
      <div class="empty-state-hint">点击右下角 + 记录第一条研发日志</div>
    </div>`;
    return html;
  }

  [...db.journals].sort((a,b) => b.createdAt - a.createdAt).forEach(j => {
    html += `
      <div class="journal-card">
        <div class="journal-card-header">
          <div class="journal-card-title">${j.title}</div>
          <div class="journal-card-date">${formatDate(j.createdAt)}</div>
        </div>
        <div class="journal-card-body">${j.content}</div>
        ${j.tags && j.tags.length > 0 ? `<div class="journal-card-tags">${j.tags.map(t => `<span class="tag tag-coffee">${t}</span>`).join('')}</div>` : ''}
        <div class="journal-card-actions">
          <button class="btn btn-sm btn-secondary" onclick="editJournal('${j.id}')">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="deleteJournal('${j.id}')">删除</button>
        </div>
      </div>
    `;
  });

  return html;
}

// ===== 图库 =====
function renderGallery() {
  let html = `
    <h1 class="page-title">📸 成品图库</h1>
    <p class="page-subtitle">饮品成品照片管理</p>
  `;

  if (db.images.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">📸</div>
      <div class="empty-state-text">还没有成品图片</div>
      <div class="empty-state-hint">点击右下角 + 上传第一张成品图</div>
    </div>`;
    return html;
  }

  html += `<div class="gallery-grid">`;
  [...db.images].sort((a,b) => b.createdAt - a.createdAt).forEach(img => {
    html += `
      <div class="gallery-item" onclick="viewImage('${img.id}')">
        <img src="${img.data}" alt="${img.name}">
        <div class="gallery-item-info">
          <div class="gallery-item-name">${img.name}</div>
          <div class="gallery-item-date">${formatDateShort(img.createdAt)}</div>
        </div>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

// ===== 评分星星渲染 =====
function renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  let html = '<span class="stars">';
  for (let i = 0; i < 5; i++) {
    if (i < full) html += '★';
    else if (i === full && half) html += '☆';
    else html += '☆';
  }
  html += '</span>';
  return html;
}

// ===== 浮动按钮 =====
function handleFab() {
  switch(currentPage) {
    case 'materials': showMaterialModal(); break;
    case 'recipes': showRecipeModal(); break;
    case 'journal': showJournalModal(); break;
    case 'gallery': showImageModal(); break;
    default: showJournalModal(); break;
  }
}

// ===== 原材料模态框 =====
function showMaterialModal(id) {
  const m = id ? db.materials.find(x => x.id === id) : {};

function previewImage(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    // 压缩图片
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxW = 800;
      const maxH = 800;
      let w = img.width;
      let h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxH) { w = w * maxH / h; h = maxH; }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.8);
      const preview = document.getElementById('img-preview');
      preview.src = compressed;
      preview.style.display = 'block';
      preview.dataset.compressed = compressed;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveImage() {
  const preview = document.getElementById('img-preview');
  const data = preview.dataset.compressed;
  if (!data) { showToast('请先选择图片'); return; }

  const name = document.getElementById('img-name').value.trim() || '未命名';
  const notes = document.getElementById('img-notes').value.trim();

  db.images.push({
    id: genId(),
    name,

    data,
    createdAt: Date.now(),
  });

}

function showModal(title, body, footerButtons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;

  let footerHtml = '';
  footerButtons.forEach(btn => {
    footerHtml += `<button class="btn ${btn.class}" onclick="${btn.action}">${btn.text}</button>`;
  });
  document.getElementById('modal-footer').innerHTML = footerHtml;

  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  currentRating = 0;
}

// ===== 提示消息 =====
function showToast(msg) {
  // 移除已有toast
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);

  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

// ===== 数据导入导出 =====
function exportData() {
  const data = JSON.stringify(db, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `00的实验室_${formatDateShort(Date.now())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}

function importData() {
  document.getElementById('import-file').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.materials && data.recipes && data.journals) {
        if (confirm('导入将覆盖现有数据，确定继续？')) {
          db = data;
          if (!db.images) db.images = [];
          saveDB();
          renderPage(currentPage);
          showToast('数据已导入');
        }
      } else {
        showToast('文件格式不正确');
      }
    } catch(err) {
      showToast('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', function() {
  loadDB();
  navigate('dashboard');

  // 导航点击
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', function(e) {
      e.preventDefault();
      navigate(this.dataset.page);
    });
  });

  // 点击遮罩关闭模态框
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ESC关闭模态框
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  updateStorageInfo();

  // Service Worker（离线支持）
  const swCode = `// 咖啡研发工作台 - Service Worker
const CACHE_NAME = 'coffee-lab-v1';
const ASSETS = [
  './',
  './index.html',
  './style.css',
  './app.js',
  './manifest.json',
  './icon-192.png',
  './icon-512.png'
];

// 安装：缓存资源
self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS))
  );
  self.skipWaiting();
});

// 激活：清理旧缓存
self.addEventListener('activate', event => {
  event.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))
    )
  );
  self.clients.claim();
});

// 拦截请求：缓存优先
self.addEventListener('fetch', event => {
  if (event.request.method !== 'GET') return;
  event.respondWith(
    caches.match(event.request).then(cached => {
      return cached || fetch(event.request).then(response => {
        // 把新资源也缓存
        if (response.status === 200) {
          const clone = response.clone();
          caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));
        }
        return response;
      }).catch(() => cached);
    })
  );
});`; if("serviceWorker" in navigator){navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:"application/javascript"}))).catch(()=>{});}
});
