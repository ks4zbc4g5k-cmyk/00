<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来杯冰美式｜咖啡自媒体工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: 'class',
  theme:{
    extend:{
      colors:{
        coffee:'#6b4f3f',
        cream:'#f8f3eb'
      }
    }
  }
}
</script>
<style>
*{ -webkit-tap-highlight-color:transparent; }
body{ font-family:system-ui, -apple-system; }
.slide-enter{ transform:translateX(-100%); }
</style>
</head>
<body class="bg-cream dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
<div id="app">
<!--顶部导航-->
<header class="sticky top-0 z-40 bg-white/80 dark:bg-gray-800/80 backdrop-blur border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex items-center justify-between">
  <button onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
    <i class="fa fa-bars text-lg"></i>
  </button>
  <div class="flex items-center gap-2">
    <span class="text-xl">☕</span>
    <h1 class="font-semibold text-lg">来杯冰美式｜咖啡自媒体工作台</h1>
    <span class="text-xs px-1.5 py-0.5 rounded bg-gray-200 dark:bg-gray-600">v3.0</span>
  </div>
  <button onclick="toggleDark()" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
    <i class="fa fa-moon-o dark:hidden"></i>
    <i class="fa fa-sun-o hidden dark:inline"></i>
  </button>
</header>

<!--侧边栏-->
<div id="sidebar" class="fixed inset-0 z-50">
  <div onclick="toggleSidebar()" class="absolute inset-0 bg-black/40"></div>
  <div class="absolute left-0 top-0 bottom-0 w-[260px] bg-white dark:bg-gray-800 shadow-xl p-4 overflow-y-auto">
    <div class="font-bold text-base mb-6 mt-2 text-coffee dark:text-white">导航菜单</div>
    <div class="space-y-1">
      <div onclick="switchPage('plan')" class="menu-item flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer">
        <i class="fa fa-calendar-check-o w-5 text-center"></i>
        <span>每日计划</span>
      </div>
      <div onclick="switchPage('inspire')" class="menu-item flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer">
        <i class="fa fa-lightbulb-o w-5 text-center"></i>
        <span>咖啡灵感</span>
      </div>
      <div onclick="switchPage('hot')" class="menu-item flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer">
        <i class="fa fa-fire w-5 text-center"></i>
        <span>爆款咖啡</span>
      </div>
      <div onclick="switchPage('note')" class="menu-item flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer">
        <i class="fa fa-sticky-note-o w-5 text-center"></i>
        <span>备忘录</span>
      </div>
    </div>
  </div>
</div>

<!--主内容区域-->
<main class="p-4 max-w-2xl mx-auto">
  <!--每日计划页-->
  <div id="page-plan" class="page">
    <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa fa-calendar-check-o"></i>每日计划</h2>
    <div class="flex gap-2 mb-4">
      <input id="input-plan" class="flex-1 border dark:border-gray-600 dark:bg-gray-800 rounded-lg px-3 py-2 outline-none" placeholder="添加今日任务...">
      <button onclick="addPlan()" class="px-4 bg-coffee text-white rounded-lg">添加</button>
    </div>
    <div id="list-plan" class="space-y-2"></div>
  </div>

  <!--咖啡灵感页-->
  <div id="page-inspire" class="page hidden">
    <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa fa-lightbulb-o"></i>咖啡灵感</h2>
    <div class="flex gap-2 mb-4">
      <input id="input-inspire" class="flex-1 border dark:border-gray-600 dark:bg-gray-800 rounded-lg px-3 py-2 outline-none" placeholder="新品构思 / 风味创意 /饮品命名...">
      <button onclick="addInspire()" class="px-4 bg-coffee text-white rounded-lg">添加</button>
    </div>
    <div id="list-inspire" class="space-y-2"></div>
  </div>

  <!--爆款咖啡页-->
  <div id="page-hot" class="page hidden">
    <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa fa-fire"></i>爆款咖啡</h2>
    <div class="flex gap-2 mb-4">
      <input id="input-hot" class="flex-1 border dark:border-gray-600 dark:bg-gray-800 rounded-lg px-3 py-2 outline-none" placeholder="热门配方 /短视频选题 /脚本思路">
      <button onclick="addHot()" class="px-4 bg-coffee text-white rounded-lg">添加</button>
    </div>
    <div id="list-hot" class="space-y-2"></div>
  </div>

  <!--备忘录页-->
  <div id="page-note" class="page hidden">
    <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa fa-sticky-note-o"></i>备忘录</h2>
    <textarea id="text-note" class="w-full min-h-[320px] border dark:border-gray-600 dark:bg-gray-800 rounded-lg p-3 outline-none" placeholder="原料成本、供应商、账号复盘、杂项笔记..."></textarea>
    <button onclick="saveNote()" class="mt-3 px-4 bg-coffee text-white rounded-lg">保存备忘录</button>
  </div>
</main>
</div>

<script>
// ========= 数据存储 =========
const STORAGE_KEY = "coffee-workspace-data";
let data = {
  plan:[],
  inspire:[],
  hot:[],
  note:""
};

// 读取本地存储
function loadData(){
  const str = localStorage.getItem(STORAGE_KEY);
  if(str){
    try{ data = JSON.parse(str); }catch(e){}
  }
  renderAll();
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ========= 页面切换 =========
function switchPage(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  document.getElementById("page-"+name).classList.remove("hidden");
  toggleSidebar();
}
function toggleSidebar(){
  const box = document.getElementById("sidebar");
  box.style.display = box.style.display==='none' ? 'block' : 'none';
}
// 初始化侧边栏状态
document.getElementById("sidebar").style.display = 'none';

// ========= 暗黑模式 =========
function toggleDark(){
  document.documentElement.classList.toggle("dark");
}

// ========= 每日计划 =========
function addPlan(){
  const val = document.getElementById("input-plan").value.trim();
  if(!val)return;
  data.plan.push({ id:Date.now(), text:val, done:false });
  document.getElementById("input-plan").value="";
  saveData();renderAll();
}
function delPlan(id){
  data.plan = data.plan.filter(item=>item.id!==id);
  saveData();renderAll();
}
function togglePlan(id){
  const item = data.plan.find(x=>x.id===id);
  if(item){ item.done=!item.done; saveData(); }
  renderAll();
}

// ========= 咖啡灵感 =========
function addInspire(){
  const val = document.getElementById("input-inspire").value.trim();
  if(!val)return;
  data.inspire.push({ id:Date.now(), text:val });
  document.getElementById("input-inspire").value="";
  saveData();renderAll();
}
function delInspire(id){
  data.inspire = data.inspire.filter(item=>item.id!==id);
  saveData();renderAll();
}

// ========= 爆款咖啡 =========
function addHot(){
  const val = document.getElementById("input-hot").value.trim();
  if(!val)return;
  data.hot.push({ id:Date.now(), text:val });
  document.getElementById("input-hot").value="";
  saveData();renderAll();
}
function delHot(id){
  data.hot = data.hot.filter(item=>item.id!==id);
  saveData();renderAll();
}

// ========= 备忘录 =========
function saveNote(){
  data.note = document.getElementById("text-note").value;
  saveData();
  alert("备忘录已保存");
}

// ========= 渲染全部列表 =========
function renderAll(){
  // 计划渲染
  let htmlPlan = "";
  data.plan.forEach(item=>{
    htmlPlan += `
    <div class="flex items-center justify-between border dark:border-gray-700 rounded-lg px-3 py-2.5">
      <label class="flex items-center gap-2">
        <input type="checkbox" ${item.done?"checked":""} onchange="togglePlan(${item.id})">
        <span class="${item.done?'line-through opacity-60':''}">${item.text}</span>
      </label>
      <button onclick="delPlan(${item.id})" class="text-red-400"><i class="fa fa-trash-o"></i></button>
    </div>`;
  });
  document.getElementById("list-plan").innerHTML = htmlPlan;

  // 灵感渲染
  let htmlInspire = "";
  data.inspire.forEach(item=>{
    htmlInspire += `
    <div class="flex items-center justify-between border dark:border-gray-700 rounded-lg px-3 py-2.5">
      <span>${item.text}</span>
      <button onclick="delInspire(${item.id})" class="text-red-400"><i class="fa fa-trash-o"></i></button>
    </div>`;
  });
  document.getElementById("list-inspire").innerHTML = htmlInspire;

  // 爆款咖啡渲染
  let htmlHot = "";
  data.hot.forEach(item=>{
    htmlHot += `
    <div class="flex items-center justify-between border dark:border-gray-700 rounded-lg px-3 py-2.5">
      <span>${item.text}</span>
      <button onclick="delHot(${item.id})" class="text-red-400"><i class="fa fa-trash-o"></i></button>
    </div>`;
  });
  document.getElementById("list-hot").innerHTML = htmlHot;

  //备忘录填充
  document.getElementById("text-note").value = data.note;
}

// 页面初始化
loadData();
</script>
</body>
</html>
