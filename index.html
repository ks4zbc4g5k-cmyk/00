<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="00的实验室">
<meta name="theme-color" content="#f5f0e8">
<title>00的实验室</title>
<style>
:root {
  --bg: #f5f0e8;
  --bg-card: #fff;
  --bg-elevated: #faf8f3;
  --text: #2c2c2c;
  --text-light: #6b6b6b;
  --text-muted: #999;
  --border: #e8e4dc;
  --accent: #8B6F47;
  --accent-light: #A0845C;
  --accent-bg: #f5efe5;
  --green: #5a8a5a;
  --orange: #c49050;
  --red: #b05040;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
}
[data-theme="dark"] {
  --bg: #1a1a18;
  --bg-card: #252522;
  --bg-elevated: #2a2a26;
  --text: #e8e4dc;
  --text-light: #a0a098;
  --text-muted: #6a6a64;
  --border: #3a3a34;
  --accent: #c4a882;
  --accent-light: #d4b892;
  --accent-bg: #2a2820;
  --shadow: 0 2px 8px rgba(0,0,0,0.2);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); transition:background .3s,color .3s; overflow:hidden; }

/* Layout */
.app { height:100%; display:flex; flex-direction:column; }
.header { padding:12px 16px 8px; padding-top:max(12px,env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; }
.header-left { display:flex; align-items:center; gap:10px; }
.avatar { width:36px; height:36px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:18px; }
.header-title { font-size:18px; font-weight:700; }
.header-date { font-size:12px; color:var(--text-muted); margin-top:2px; }
.header-btns { display:flex; gap:8px; }
.icon-btn { width:36px; height:36px; border-radius:50%; border:none; background:var(--bg-elevated); color:var(--text); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; }
.icon-btn:active { transform:scale(0.92); }

/* Main Content */
.main { flex:1; overflow-y:auto; padding:0 16px 100px; -webkit-overflow-scrolling:touch; }
.main::-webkit-scrollbar { display:none; }

/* Calendar */
.calendar-card { background:var(--bg-card); border-radius:var(--radius); padding:16px; margin-bottom:16px; box-shadow:var(--shadow); }
.cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.cal-month { font-size:16px; font-weight:700; }
.cal-nav { display:flex; gap:4px; }
.cal-nav button { width:28px; height:28px; border:none; background:transparent; color:var(--text); font-size:14px; cursor:pointer; border-radius:6px; }
.cal-nav button:active { background:var(--bg-elevated); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-day-label { text-align:center; font-size:11px; color:var(--text-muted); font-weight:500; padding:4px 0; }
.cal-day { aspect-ratio:1; border-radius:var(--radius-sm); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; transition:all .2s; background:var(--bg-elevated); }
.cal-day:hover { transform:scale(1.05); }
.cal-day-num { font-size:13px; font-weight:600; }
.cal-day-img { width:28px; height:28px; border-radius:6px; object-fit:cover; margin-top:2px; }
.cal-day-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); position:absolute; bottom:4px; }
.cal-day-sticker { font-size:14px; position:absolute; top:2px; right:2px; line-height:1; }
.cal-day.today { border:2px solid var(--accent); }
.cal-day.other-month { opacity:0.35; }
.cal-day.has-photo { background:var(--accent-bg); }
.cal-day.selected { background:var(--accent); color:#fff; }
.cal-day.selected .cal-day-num { color:#fff; }
.cal-day.selected .cal-day-dot { background:#fff; }

/* Stats Row */
.stats-row { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
.stat-card { background:var(--bg-card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
.stat-label { font-size:12px; color:var(--text-muted); margin-bottom:4px; }
.stat-value { font-size:28px; font-weight:800; color:var(--accent); }
.stat-sub { font-size:12px; color:var(--text-light); margin-top:4px; }

/* Section */
.section { margin-bottom:20px; }
.section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.section-title { font-size:16px; font-weight:700; }
.section-more { font-size:13px; color:var(--accent); cursor:pointer; }

/* Recipe Cards */
.recipe-list { display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; }
.recipe-list::-webkit-scrollbar { display:none; }
.recipe-card { min-width:140px; background:var(--bg-card); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform .2s; }
.recipe-card:active { transform:scale(0.96); }
.recipe-img { width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--bg-elevated); }
.recipe-info { padding:10px; }
.recipe-name { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.recipe-meta { font-size:11px; color:var(--text-muted); margin-top:4px; }

/* Swipeable Recipe Row */
.swipe-row { position:relative; overflow:hidden; border-radius:var(--radius-sm); margin-bottom:8px; }
.swipe-bg { position:absolute; inset:0; display:flex; justify-content:flex-end; align-items:center; padding-right:16px; gap:0; z-index:1; }
.swipe-bg .swipe-btn { width:70px; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
.swipe-bg .swipe-edit { background:var(--orange); }
.swipe-bg .swipe-delete { background:var(--red); }
.swipe-content { position:relative; z-index:2; background:var(--bg-card); transition:transform .25s ease; }
.swipe-content.swiped { transform:translateX(-140px); }

/* Recipe Category Section */
.cat-section { margin-bottom:20px; }
.cat-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.cat-icon { font-size:20px; }
.cat-title { font-size:15px; font-weight:700; }

/* Favorite Card */
.fav-card { background:var(--bg-card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:16px; }
.fav-img { width:80px; height:80px; border-radius:var(--radius-sm); object-fit:cover; background:var(--bg-elevated); }
.fav-info { flex:1; }
.fav-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
.fav-name { font-size:18px; font-weight:700; margin-top:4px; }
.fav-count { font-size:13px; color:var(--text-light); margin-top:4px; }
.fav-actions { display:flex; gap:8px; margin-top:8px; }
.fav-btn { width:32px; height:32px; border-radius:50%; border:none; background:var(--bg-elevated); font-size:14px; cursor:pointer; }

/* Collection / Inspiration Board */
.inspo-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.inspo-card { background:var(--bg-card); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform .2s; }
.inspo-card:active { transform:scale(0.96); }
.inspo-card-img { width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--bg-elevated); }
.inspo-card-body { padding:10px 12px; }
.inspo-card-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.inspo-card-meta { font-size:11px; color:var(--text-muted); margin-top:4px; display:flex; align-items:center; gap:4px; }
.inspo-card .tag { font-size:10px; padding:2px 8px; }
.inspo-add { aspect-ratio:auto; min-height:140px; background:var(--bg-card); border:2px dashed var(--border); border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); transition:all .2s; }
.inspo-add:active { border-color:var(--accent); color:var(--accent); }
.inspo-add-icon { font-size:32px; }
.inspo-add-text { font-size:12px; margin-top:6px; }
.inspo-detail-img { width:100%; max-height:300px; object-fit:contain; background:var(--bg-elevated); border-radius:var(--radius-sm); }
.inspo-detail-title { font-size:18px; font-weight:700; margin-top:12px; }
.inspo-detail-tags { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
.inspo-detail-text { font-size:14px; color:var(--text-light); line-height:1.7; margin-top:12px; white-space:pre-wrap; }
.inspo-detail-date { font-size:12px; color:var(--text-muted); margin-top:16px; }

/* Bottom Nav */
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--bg-card); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:100; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 0; cursor:pointer; border:none; background:transparent; color:var(--text-muted); font-size:10px; transition:all .2s; }
.nav-item.active { color:var(--accent); }
.nav-item .nav-icon { font-size:22px; }
.nav-fab { width:48px; height:48px; border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:24px; display:flex; align-items:center; justify-content:center; margin-top:-24px; box-shadow:var(--shadow-lg); cursor:pointer; transition:transform .2s; }
.nav-fab:active { transform:scale(0.9); }

/* Pages */
.page { display:none; }
.page.active { display:block; }

/* Recipe Detail */
.detail-hero { width:100%; height:240px; object-fit:cover; background:var(--bg-elevated); }
.detail-body { padding:20px 16px; }
.detail-title { font-size:22px; font-weight:700; }
.detail-tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.tag { padding:4px 10px; border-radius:20px; background:var(--accent-bg); color:var(--accent); font-size:12px; }
.detail-section { margin-top:20px; }
.detail-section h3 { font-size:14px; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
.ingredient-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
.step-item { display:flex; gap:12px; padding:12px 0; }
.step-num { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
.step-text { flex:1; font-size:14px; line-height:1.6; }

/* Forms */
.form-group { margin-bottom:16px; }
.form-label { display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px; }
.form-input, .form-textarea, .form-select { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-card); color:var(--text); font-size:15px; font-family:inherit; }
.form-textarea { min-height:100px; resize:vertical; }
.form-input:focus, .form-textarea:focus { outline:none; border-color:var(--accent); }
.btn { padding:14px 24px; border-radius:var(--radius-sm); border:none; font-size:15px; font-weight:600; cursor:pointer; transition:all .2s; position:relative; z-index:502; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:active { transform:scale(0.97); }
.btn-secondary { background:var(--bg-elevated); color:var(--text); }
.photo-upload { width:100%; aspect-ratio:4/3; border:2px dashed var(--border); border-radius:var(--radius-sm); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); overflow:hidden; }
.photo-upload.has-img { border-style:solid; border-color:var(--accent); }
.photo-upload img { width:100%; height:100%; object-fit:cover; border-radius:var(--radius-sm); }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:500; display:none; align-items:flex-end; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-sheet { background:var(--bg-card); width:100%; max-height:85vh; border-radius:var(--radius) var(--radius) 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); overflow-y:auto; transform:translateY(100%); transition:transform .3s cubic-bezier(0.32,0.72,0,1); position:relative; z-index:501; }
.modal-overlay.show .modal-sheet { transform:translateY(0); }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-title { font-size:18px; font-weight:700; }
.modal-close { width:32px; height:32px; border-radius:50%; border:none; background:var(--bg-elevated); font-size:18px; cursor:pointer; }

/* Toast */
.toast { position:fixed; top:max(60px,env(safe-area-inset-top) + 50px); left:50%; transform:translateX(-50%) translateY(-20px); background:rgba(0,0,0,0.8); color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; opacity:0; transition:all .3s; z-index:600; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* Empty State */
.empty { text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty-icon { font-size:48px; margin-bottom:12px; }

/* Ingredient List */
.ing-list { display:flex; flex-direction:column; gap:8px; }
.ing-item { display:flex; align-items:center; gap:12px; background:var(--bg-card); padding:12px 14px; border-radius:var(--radius-sm); box-shadow:var(--shadow); }
.ing-icon { width:40px; height:40px; border-radius:10px; background:var(--accent-bg); display:flex; align-items:center; justify-content:center; font-size:20px; }
.ing-info { flex:1; }
.ing-name { font-size:14px; font-weight:600; }
.ing-meta { font-size:12px; color:var(--text-muted); margin-top:2px; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="avatar">☕</div>
      <div>
        <div class="header-title">00的实验室</div>
        <div class="header-date" id="header-date">Today</div>
      </div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main" id="main">
    <!-- Home Page -->
    <div class="page active" id="page-home">
      <!-- Calendar -->
      <div class="calendar-card">
        <div class="cal-header">
          <div class="cal-month" id="cal-month">2026年7月</div>
          <div class="cal-nav">
            <button onclick="changeMonth(-1)">‹</button>
            <button onclick="changeMonth(1)">›</button>
          </div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card" onclick="showPage('recipes')" style="cursor:pointer;">
          <div class="stat-label">本月制作</div>
          <div class="stat-value" id="stat-brews">0</div>
          <div class="stat-sub" id="stat-items">0 种饮品</div>
        </div>
        <div class="stat-card" onclick="showPage('home')" style="cursor:pointer;">
          <div class="stat-label">灵感收集</div>
          <div class="stat-value" id="stat-inspos">0</div>
          <div class="stat-sub">截图 · 笔记 · 想法</div>
        </div>
      </div>

      <!-- Todo Projects -->
      <div class="section" id="fav-section" style="display:none;">
        <div class="section-header">
          <div class="section-title">待做项目</div>
        </div>
        <div class="fav-card" id="fav-card" onclick="showTodoList()" style="cursor:pointer;"></div>
      </div>

      <!-- Recent Recipes -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">最近配方</div>
          <div class="section-more" onclick="showPage('recipes')">查看全部 ›</div>
        </div>
        <div class="recipe-list" id="recent-recipes"></div>
      </div>

      <!-- Inspiration Board -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">灵感收集</div>
        </div>
        <div class="inspo-grid" id="inspo-grid"></div>
      </div>
    </div>

    <!-- Recipes Page -->
    <div class="page" id="page-recipes">
      <div class="stats-row" style="margin-bottom:16px;">
        <div class="stat-card">
          <div class="stat-label">配方总数</div>
          <div class="stat-value" id="stat-recipes">0</div>
          <div class="stat-sub">咖啡 · 烘焙 · 调酒 · 美食</div>
        </div>
      </div>
      <div class="section-header" style="margin-bottom:16px;">
        <div class="section-title">全部配方</div>
      </div>
      <div id="all-recipes"></div>
    </div>

    <!-- Ingredients Page -->
    <div class="page" id="page-ingredients">
      <div class="section-header" style="margin-bottom:16px;">
        <div class="section-title">原料库</div>
      </div>
      <div class="ing-list" id="ing-list"></div>
    </div>

    <!-- Profile Page -->
    <div class="page" id="page-profile">
      <div style="text-align:center; padding:40px 20px;">
        <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto 16px;">☕</div>
        <div style="font-size:20px; font-weight:700;">00的实验室</div>
        <div style="font-size:14px; color:var(--text-muted); margin-top:8px;">记录每一杯好味道</div>
      </div>
      <div style="padding:0 16px;">
        <div class="ing-item" onclick="exportData()">
          <div class="ing-icon">📤</div>
          <div class="ing-info"><div class="ing-name">导出数据</div><div class="ing-meta">备份所有配方和记录</div></div>
        </div>
        <div class="ing-item" onclick="importData()" style="margin-top:8px;">
          <div class="ing-icon">📥</div>
          <div class="ing-info"><div class="ing-name">导入数据</div><div class="ing-meta">从备份文件恢复</div></div>
        </div>
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="handleImport(this)">
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="showPage('home')">
      <span class="nav-icon">🏠</span>
      <span>主页</span>
    </button>
    <button class="nav-item" onclick="showPage('recipes')">
      <span class="nav-icon">📝</span>
      <span>配方</span>
    </button>
    <div style="flex:1;display:flex;justify-content:center;">
      <button class="nav-fab" onclick="openAddModal()">+</button>
    </div>
    <button class="nav-item" onclick="showPage('ingredients')">
      <span class="nav-icon">📦</span>
      <span>原料</span>
    </button>
    <button class="nav-item" onclick="showPage('profile')">
      <span class="nav-icon">⚙️</span>
      <span>设置</span>
    </button>
  </div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="add-modal" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title">添加记录</div>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div style="display:flex; gap:12px; margin-bottom:12px;">
      <button class="btn btn-primary" style="flex:1;" onclick="openRecipeForm()">+ 新配方</button>
      <button class="btn btn-secondary" style="flex:1;" onclick="openCheckinForm()">☕ 打卡</button>
    </div>
    <div style="display:flex; gap:12px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="openInspoForm()">💡 灵感</button>
      <button class="btn btn-secondary" style="flex:1;" onclick="openTodoForm()">📋 新项目</button>
    </div>
  </div>
</div>

<!-- Recipe Form Modal -->
<div class="modal-overlay" id="recipe-modal" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title">新配方</div>
      <button class="modal-close" onclick="closeRecipeModal()">✕</button>
    </div>
    <div class="photo-upload" id="recipe-photo-upload" onclick="document.getElementById('recipe-photo').click()">
      <span style="font-size:32px;">📷</span>
      <span style="font-size:13px; margin-top:8px;">点击添加成品照片</span>
    </div>
    <input type="file" id="recipe-photo" accept="image/*" style="display:none" onchange="handleRecipePhoto(this)">
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" class="form-input" id="r-date">
    </div>
    <div class="form-group">
      <label class="form-label">名称</label>
      <input type="text" class="form-input" id="r-name" placeholder="例如：燕麦拿铁">
    </div>
    <div class="form-group">
      <label class="form-label">分类</label>
      <select class="form-select" id="r-category">
        <option value="coffee">☕ 咖啡</option>
        <option value="tea">🍵 茶饮</option>
        <option value="bakery">🥖 烘焙</option>
        <option value="cocktail">🍸 调酒</option>

<script>
// ==================== DATA ====================
let db = JSON.parse(localStorage.getItem('coffee_lab_00') || 'null') || {
  recipes: [],
  checkins: [],
  ingredients: [],
  settings: { theme: 'light' }
};

let currentMonth = new Date();
let selectedRating = 0;
let tempRecipePhoto = '';
let tempCheckinPhoto = '';
let tempInspoPhoto = '';
let selectedDate = ''; // calendar selected date

function saveDB() {
  localStorage.setItem('coffee_lab_00', JSON.stringify(db));
}

// ==================== INIT ====================
function init() {
  updateHeaderDate();
  renderCalendar();
  renderStats();
  renderRecentRecipes();
  renderInspo();
  renderAllRecipes();
  renderIngredients();
  updateCheckinRecipeSelect();

  // Theme
  if (db.settings.theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('theme-btn').textContent = '☀️';
  }

  // Demo data
  if (db.recipes.length === 0) {
    addDemoData();
  }
}

function addDemoData() {
  db.recipes = [
    { id: '1', name: '燕麦拿铁', category: 'coffee', photo: '', ingredients: '浓缩咖啡 1份\n燕麦奶 200ml\n冰块 适量', steps: '1. 萃取浓缩咖啡\n2. 杯中加入冰块\n3. 倒入燕麦奶\n4. 倒入浓缩咖啡', notes: '燕麦奶用OATLY咖啡大师版', createdAt: Date.now() - 86400000 * 3 },
    { id: '2', name: '抹茶贝果', category: 'bakery', photo: '', ingredients: '高筋面粉 300g\n抹茶粉 10g\n酵母 3g\n糖 15g\n盐 5g\n水 170ml', steps: '1. 混合所有材料\n2. 揉面至扩展阶段\n3. 发酵1小时\n4. 整形\n5. 煮糖水\n6. 200度烤20分钟', notes: '煮糖水时每面30秒', createdAt: Date.now() - 86400000 * 5 },
    { id: '3', name: '巴斯克芝士', category: 'bakery', photo: '', ingredients: '奶油奶酪 350g\n糖 80g\n鸡蛋 3个\n淡奶油 180g\n低筋面粉 10g', steps: '1. 奶油奶酪软化加糖\n2. 分次加入鸡蛋\n3. 加入淡奶油\n4. 筛入面粉\n5. 220度烤25分钟', notes: '表面焦黑是正常的', createdAt: Date.now() - 86400000 * 7 }
  ];
  db.checkins = [
    { date: fmtDateKey(new Date(Date.now() - 86400000 * 2)), recipeId: '1', name: '燕麦拿铁', photo: '', rating: 5, notes: '今天拉花有进步！' },
    { date: fmtDateKey(new Date(Date.now() - 86400000 * 4)), recipeId: '2', name: '抹茶贝果', photo: '', rating: 4, notes: '表皮有点硬，下次缩短烤时' }
  ];
  saveDB();
  renderCalendar();
  renderStats();
  renderRecentRecipes();
  renderAllRecipes();
}

// ==================== UI HELPERS ====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    db.settings.theme = 'light';
    document.getElementById('theme-btn').textContent = '🌙';
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    db.settings.theme = 'dark';
    document.getElementById('theme-btn').textContent = '☀️';
  }
  saveDB();
}

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.target.closest('.nav-item')?.classList.add('active');

  if (page === 'recipes') renderAllRecipes();
  if (page === 'ingredients') renderIngredients();
}

function updateHeaderDate() {
  const d = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('header-date').textContent = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function fmtDateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ==================== CALENDAR ====================
function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('cal-month').textContent = year + '年' + (month+1) + '月';

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();

  let html = '';
  const weekDays = ['日','一','二','三','四','五','六'];
  weekDays.forEach(d => html += '<div class="cal-day-label">' + d + '</div>');

  // Prev month
  for (let i = firstDay - 1; i >= 0; i--) {
    html += '<div class="cal-day other-month"><span class="cal-day-num">' + (daysInPrev - i) + '</span></div>';
  }

  // Current month
  const today = fmtDateKey(new Date());
  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const checkins = db.checkins.filter(c => c.date === dateKey);
    const recipes = db.recipes.filter(r => fmtDateKey(new Date(r.createdAt)) === dateKey);
    const inspos = (db.inspirations || []).filter(i => fmtDateKey(new Date(i.createdAt)) === dateKey);
    const todos = (db.todos || []).filter(t => fmtDateKey(new Date(t.createdAt)) === dateKey);
    const isToday = dateKey === today;
    
    // Determine sticker
    let sticker = '';
    if (checkins.length) sticker = '☕';
    else if (recipes.length) sticker = '📝';
    else if (inspos.length) sticker = '💡';
    else if (todos.length) sticker = '📋';
    
    // If multiple types, use mix icon
    const types = [checkins.length, recipes.length, inspos.length, todos.length].filter(x => x > 0).length;
    if (types >= 2) sticker = '✨';

    html += '<div class="cal-day ' + (isToday ? 'today ' : '') + (checkins.length ? 'has-photo' : '') + '" onclick="onDayClick(\'' + dateKey + '\')">';
    html += '<span class="cal-day-num">' + d + '</span>';
    if (sticker) html += '<span class="cal-day-sticker">' + sticker + '</span>';
    html += '</div>';
  }

  // Next month
  const remaining = (7 - ((firstDay + daysInMonth) % 7)) % 7;
  for (let d = 1; d <= remaining; d++) {
    html += '<div class="cal-day other-month"><span class="cal-day-num">' + d + '</span></div>';
  }

  document.getElementById('cal-grid').innerHTML = html;
}

function changeMonth(delta) {
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  renderCalendar();
}

function onDayClick(dateKey) {
  // Show day summary instead of jumping
  showDaySummary(dateKey);
  
  // Select this date for + button
  selectedDate = dateKey;
  document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
  event.target.closest('.cal-day')?.classList.add('selected');
}

function showDaySummary(dateKey) {
  const checkins = db.checkins.filter(c => c.date === dateKey);
  const recipes = db.recipes.filter(r => fmtDateKey(new Date(r.createdAt)) === dateKey);
  const inspos = (db.inspirations || []).filter(i => fmtDateKey(new Date(i.createdAt)) === dateKey);
  const todos = (db.todos || []).filter(t => fmtDateKey(new Date(t.createdAt)) === dateKey);
  
  let html = '<div style="padding:8px 0;">';
  html += '<div style="font-size:18px;font-weight:700;margin-bottom:16px;">' + dateKey + '</div>';
  
  if (checkins.length === 0 && recipes.length === 0 && inspos.length === 0 && todos.length === 0) {
    html += '<div class="empty"><div class="empty-icon">📅</div><p>这一天还没有记录</p><p style="font-size:13px;color:var(--text-muted);margin-top:8px;">点击 + 添加内容</p></div>';
  } else {
    if (checkins.length) {
      html += '<div class="detail-section"><h3>☕ 打卡</h3>';
      checkins.forEach(c => {
        html += '<div class="ing-item" style="margin-bottom:8px;cursor:pointer;" onclick="showCheckinDetail(\'' + c.date + '\')"><div class="ing-icon">☕</div><div class="ing-info"><div class="ing-name">' + c.name + ' ★' + c.rating + '</div><div class="ing-meta">' + (c.notes || '') + '</div></div></div>';
      });
      html += '</div>';
    }
    if (recipes.length) {
      html += '<div class="detail-section"><h3>📝 配方</h3>';
      recipes.forEach(r => {
        html += '<div class="ing-item" style="margin-bottom:8px;cursor:pointer;" onclick="showRecipeDetail(\'' + r.id + '\')"><div class="ing-icon" style="font-size:24px;">' + catEmoji(r.category) + '</div><div class="ing-info"><div class="ing-name">' + r.name + '</div><div class="ing-meta">' + catName(r.category) + '</div></div></div>';
      });
      html += '</div>';
    }
    if (inspos.length) {
      html += '<div class="detail-section"><h3>💡 灵感</h3>';
      inspos.forEach(i => {
        html += '<div class="ing-item" style="margin-bottom:8px;cursor:pointer;" onclick="showInspoDetail(\'' + i.id + '\')"><div class="ing-icon">💡</div><div class="ing-info"><div class="ing-name">' + i.title + '</div><div class="ing-meta">' + i.category + '</div></div></div>';
      });
      html += '</div>';
    }
    if (todos.length) {
      html += '<div class="detail-section"><h3>📋 项目</h3>';
      todos.forEach(t => {
        html += '<div class="ing-item" style="margin-bottom:8px;"><div class="ing-icon">' + (t.done ? '✅' : '⬜') + '</div><div class="ing-info"><div class="ing-name" style="' + (t.done ? 'text-decoration:line-through;' : '') + '">' + t.title + '</div></div></div>';
      });
      html += '</div>';
    }
  }
  
  html += '</div>';
  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-modal').classList.add('show');
}

// ==================== STATS ====================
function renderStats() {
  const now = new Date();
  const monthKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const monthCheckins = db.checkins.filter(c => c.date.startsWith(monthKey));
  const uniqueItems = [...new Set(monthCheckins.map(c => c.name))];

  document.getElementById('stat-brews').textContent = monthCheckins.length;
  document.getElementById('stat-items').textContent = uniqueItems.length + ' 种饮品';
  document.getElementById('stat-inspos').textContent = (db.inspirations || []).length;

  // Todo projects
  if (!db.todos) db.todos = [];
  const todos = db.todos.filter(t => !t.done);
  if (todos.length > 0) {
    document.getElementById('fav-section').style.display = 'block';
    const todo = todos[0];
    document.getElementById('fav-card').innerHTML = `
      <div class="fav-img" style="background:var(--accent-bg); display:flex; align-items:center; justify-content:center; font-size:40px;">📋</div>
      <div class="fav-info">
        <div class="fav-label">待做项目</div>
        <div class="fav-name">${todo.title}</div>
        <div class="fav-count">${todos.length} 个待完成</div>
      </div>
    `;
  } else {
    document.getElementById('fav-section').style.display = 'block';
    document.getElementById('fav-card').innerHTML = `
      <div class="fav-img" style="background:var(--accent-bg); display:flex; align-items:center; justify-content:center; font-size:40px;">📋</div>
      <div class="fav-info">
        <div class="fav-label">待做项目</div>
        <div class="fav-name">添加你的计划</div>
        <div class="fav-count">点击 + 添加新项目</div>
      </div>
    `;
  }
}

function catEmoji(cat) {
  const map = { coffee:'☕', tea:'🍵', bakery:'🥖', cocktail:'🍸', food:'🍽️', other:'🥤' };
  return map[cat] || '☕';
}

function catName(cat) {
  const map = { coffee:'咖啡', tea:'茶饮', bakery:'烘焙', cocktail:'调酒', food:'美食', other:'其他' };
  return map[cat] || '其他';
}

// ==================== RECIPES ====================
function renderRecentRecipes() {
  const recent = [...db.recipes].sort((a,b) => b.createdAt - a.createdAt).slice(0, 5);
  let html = '';
  recent.forEach(r => {
    html += `
      <div class="recipe-card" onclick="showRecipeDetail('${r.id}')">
        <div class="recipe-img" style="display:flex; align-items:center; justify-content:center; font-size:50px; background:var(--accent-bg);">${r.photo ? '<img src="'+r.photo+'" style="width:100%;height:100%;object-fit:cover;">' : catEmoji(r.category)}</div>
        <div class="recipe-info">
          <div class="recipe-name">${r.name}</div>
          <div class="recipe-meta">${catName(r.category)}</div>
        </div>
      </div>
    `;
  });
  document.getElementById('recent-recipes').innerHTML = html || '<div class="empty"><div class="empty-icon">📝</div><p>还没有配方</p></div>';
}

function renderAllRecipes() {
  const cats = ['coffee','bakery','cocktail','food','tea','other'];
  let html = '';
  
  cats.forEach(cat => {
    const catRecipes = db.recipes.filter(r => r.category === cat);
    if (catRecipes.length === 0) return;
    
    html += '<div class="cat-section">';
    html += '<div class="cat-header"><span class="cat-icon">' + catEmoji(cat) + '</span><span class="cat-title">' + catName(cat) + '</span></div>';
    
    catRecipes.forEach(r => {
      html += '<div class="swipe-row" id="swipe-' + r.id + '">';
      html += '<div class="swipe-bg">';
      html += '<div class="swipe-btn swipe-edit" onclick="event.stopPropagation();editRecipe(\'' + r.id + '\')">编辑</div>';
      html += '<div class="swipe-btn swipe-delete" onclick="event.stopPropagation();deleteRecipe(\'' + r.id + '\')">删除</div>';
      html += '</div>';
      html += '<div class="swipe-content" ontouchstart="handleSwipeStart(event, \'' + r.id + '\')" ontouchend="handleSwipeEnd(event, \'' + r.id + '\')">';
      html += '<div class="ing-item" onclick="showRecipeDetail(\'' + r.id + '\')" style="margin:0;">';
      html += '<div class="ing-icon" style="font-size:28px;">' + catEmoji(r.category) + '</div>';
      html += '<div class="ing-info">';
      html += '<div class="ing-name">' + r.name + '</div>';
      html += '<div class="ing-meta">' + r.ingredients.split('\\n').length + ' 种原料</div>';
      html += '</div></div>';
      html += '</div></div>';
    });
    
    html += '</div>';
  });
  
  const el = document.getElementById('stat-recipes');
  if (el) el.textContent = db.recipes.length;
  document.getElementById('all-recipes').innerHTML = html || '<div class="empty"><div class="empty-icon">📝</div><p>还没有配方，点击 + 添加</p></div>';
}

let swipeStartX = {};
function handleSwipeStart(e, id) {
  swipeStartX[id] = e.touches[0].clientX;
}
function handleSwipeEnd(e, id) {
  const startX = swipeStartX[id];
  if (startX === undefined) return;
  const endX = e.changedTouches[0].clientX;
  const diff = startX - endX;
  const el = document.querySelector('#swipe-' + id + ' .swipe-content');
  if (!el) return;
  
  // Close all other swiped items
  document.querySelectorAll('.swipe-content.swiped').forEach(item => {
    if (item !== el) item.classList.remove('swiped');
  });
  
  if (diff > 50) {
    el.classList.add('swiped');
  } else if (diff < -50) {
    el.classList.remove('swiped');
  }
  delete swipeStartX[id];
}

function showRecipeDetail(id) {
  const r = db.recipes.find(x => x.id === id);
  if (!r) return;
  const ings = r.ingredients.split('\n').filter(x => x.trim());
  const steps = r.steps.split('\n').filter(x => x.trim());

  let html = '';
  if (r.photo) {
    html += '<img class="detail-hero" src="' + r.photo + '" onclick="toggleImageZoom(this)" style="cursor:zoom-in;">';
  } else {
    html += '<div class="detail-hero" style="display:flex; align-items:center; justify-content:center; font-size:80px; background:var(--accent-bg);">' + catEmoji(r.category) + '</div>';

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff/60000);
  if (mins < 60) return mins + '分钟前';
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs + '小时前';
  const days = Math.floor(hrs/24);
  if (days < 30) return days + '天前';
  return Math.floor(days/30) + '个月前';
}

// ==================== INGREDIENTS ====================
function renderIngredients() {
  if (!db.ingredientPrices) db.ingredientPrices = {};
  const allIngs = new Map();
  db.recipes.forEach(r => {
    r.ingredients.split('\n').forEach(line => {
      const trimmed = line.trim();
      if (!trimmed) return;
      const parts = trimmed.split(/\s+/);
      const name = parts[0];
      const amount = parts.slice(1).join(' ');
      if (name) {
        if (!allIngs.has(name)) allIngs.set(name, { count: 0, recipes: [], totalAmount: '' });
        const info = allIngs.get(name);
        info.count++;
        info.recipes.push({ name: r.name, amount: amount, id: r.id });
      }
    });
  });

  let html = '';
  allIngs.forEach((info, name) => {
    const price = db.ingredientPrices[name] || '';
    html += `
      <div class="ing-item" onclick="showIngredientDetail('${name.replace(/'/g, "\\'")}')" style="cursor:pointer;">
        <div class="ing-icon" style="font-size:20px;">🧂</div>
        <div class="ing-info">
          <div class="ing-name">${name}</div>
          <div class="ing-meta">用于 ${info.count} 个配方${price ? ' · ¥' + price + '/单位' : ''}</div>
        </div>
      </div>
    `;
  });
  document.getElementById('ing-list').innerHTML = html || '<div class="empty"><div class="empty-icon">📦</div><p>还没有原料记录</p></div>';
}

function showIngredientDetail(name) {
  const recipes = [];
  db.recipes.forEach(r => {
    r.ingredients.split('\n').forEach(line => {
      const trimmed = line.trim();
      if (trimmed.startsWith(name)) {
        const amount = trimmed.substring(name.length).trim();
        recipes.push({ name: r.name, amount: amount, id: r.id, category: r.category });
      }
    });
  });
  
  const price = db.ingredientPrices?.[name] || '';
  
  let html = '<div style="padding:8px 0;">';
  html += '<div style="font-size:22px;font-weight:700;margin-bottom:16px;">' + name + '</div>';
  
  // Price setting
  html += '<div class="form-group">';
  html += '<label class="form-label">单价（元/单位）</label>';
  html += '<div style="display:flex;gap:8px;">';
  html += '<input type="number" class="form-input" id="ing-price" placeholder="例如：25" value="' + price + '" style="flex:1;">';
  html += '<button class="btn btn-primary" onclick="saveIngredientPrice(\'' + name.replace(/'/g, "\\'") + '\')">保存</button>';
  html += '</div></div>';
  
  // Usage in recipes
  html += '<div class="detail-section"><h3>使用记录</h3>';
  recipes.forEach(r => {
    html += '<div class="ing-item" style="margin-bottom:8px;cursor:pointer;" onclick="showRecipeDetail(\'' + r.id + '\')">';
    html += '<div class="ing-icon" style="font-size:24px;">' + catEmoji(r.category) + '</div>';
    html += '<div class="ing-info">';
    html += '<div class="ing-name">' + r.name + '</div>';
    html += '<div class="ing-meta">用量：' + (r.amount || '-') + (price ? ' · 约 ¥' + calcCost(r.amount, price) : '') + '</div>';
    html += '</div></div>';
  });
  html += '</div>';
  
  html += '</div>';
  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-modal').classList.add('show');
}

function calcCost(amount, price) {
  if (!amount || !price) return '-';
  // Try to extract number from amount string
  const match = amount.match(/(\d+(?:\.\d+)?)/);
  if (!match) return '-';
  const num = parseFloat(match[1]);
  const unit = amount.replace(match[1], '').trim();
  // Simple calculation (assumes price is per same unit)
  const cost = (num * parseFloat(price)).toFixed(2);
  return cost + (unit ? '（' + num + unit + '）' : '');
}

function saveIngredientPrice(name) {

  db.ingredientPrices[name] = price;
  saveDB();

  renderIngredients();
}

function handleImport(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.recipes !== undefined) {
        if (confirm('导入将覆盖现有数据，确定继续？')) {
          db = data;
          saveDB();
          init();
          showToast('数据已导入');
        }
      } else {
        showToast('文件格式不正确');
      }
    } catch(err) {
      showToast('导入失败');
    }
  };
  reader.readAsText(input.files[0]);
  input.value = '';
}

// ==================== START ====================
init();
</script>
